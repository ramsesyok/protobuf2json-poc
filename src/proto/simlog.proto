syntax = "proto3";
package demo;
option java_multiple_files = true;
option java_package = "demo.proto";
option go_package = "demo/proto;demopb";

message SimLog {
  int64 job_id = 1;
  repeated ObjectLog logs = 2;
  optional Result result = 3;
}

message ObjectLog {
  int64 timestamp = 1;
  int64 object_id = 2;
  repeated Event events = 3;
}

message Result {
  int64 exit_code = 1;
  string output = 2;
}

message Event {
  int64 event_id = 1;
  int64 event_type = 2;
  oneof payload {
    CommEvent comm_event = 3;
    ExecEvent exec_event = 4;
  }
}

message CommEvent {
  int64 from_id = 1;
  int64 to_id = 2;
  string body = 3;
}

message ExecEvent {
  int64 exec_id = 1;
  string command = 2;
  string result = 3;
}

service SimService {
  // 1メッセージで全体を返す(パターン1・2用)
  rpc GetSimLog(GetSimLogRequest) returns (SimLog);
  // ObjectLogを1件ずつ流す(パターン3用)
  rpc StreamObjectLogs(GetSimLogRequest) returns (stream ObjectLog);
}

message GetSimLogRequest {
  bool include_result = 1;   // trueならresultを設定する
  int32 object_count = 2;    // ObjectLogの件数
  int32 events_per_object = 3; // 1ObjectLogあたりのEvent数
}
